<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion Face</title>
<!--
  The robot's face: small white glyphs on a navy screen. Driven by /api/events (state, emotion,
  mouth); see companion/gateway.py. Preview without the robot: face.html?demo
  (keys 1-8 = emotions, i/l/t/s/o = idle/listening/thinking/speaking/offline, space = talk).
  ?demo&cycle=3 steps through every expression and state every 3 s, labelled; ?fps shows frame rate.

  How it works: every eye and mouth is a glyph written as an SVG path (GLYPHS below), resampled
  to N points once. Any glyph morphs into any other by moving those points, so a blink is just
  "morph to a line and back" and lip sync is a blend between two mouth glyphs. Line-like glyphs
  (‿ > × ∩) are paths that go out and come back, so they have no area: the stroke draws them.
-->
<style>
  :root { --screen:#0b1a3a; --ink:#f2f6ff; }
  html, body { margin:0; height:100%; background:var(--screen); overflow:hidden; cursor:none; }
  svg { display:block; width:100vw; height:100vh; }
  path, circle, rect { fill:var(--ink); stroke:var(--ink); stroke-linejoin:round; stroke-linecap:round; }
  #thought rect { fill:none; }
  #hint { position:fixed; left:16px; bottom:12px; color:#4a5f8a; font:13px system-ui,sans-serif; display:none; }
  .demo #hint { display:block; } .demo { cursor:default; }
  #label { position:fixed; left:0; right:0; bottom:8vh; text-align:center; color:#8fa3cc;
           font:600 3.2vh system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
  #fps { position:fixed; right:16px; top:12px; color:#4a5f8a; font:14px ui-monospace,monospace; }
</style>
</head>
<body>
<svg viewBox="-500 -300 1000 600" preserveAspectRatio="xMidYMid meet" aria-label="robot face">
  <g id="face">
    <path id="eyeL" stroke-width="14"/>
    <path id="eyeR" stroke-width="14"/>
    <path id="mouth" stroke-width="12"/>
  </g>
  <g id="thought" opacity="0">
    <rect x="-70" y="-26" width="140" height="52" rx="26" stroke-width="8"/>
    <circle cx="-34" r="8" stroke-width="0"/><circle cx="0" r="8" stroke-width="0"/><circle cx="34" r="8" stroke-width="0"/>
  </g>
</svg>
<div id="label"></div><div id="fps"></div>
<div id="hint">demo · 1 neutral · 2 happy · 3 excited · 4 curious · 5 surprised · 6 sad · 7 confused · 8 love · i l t s o states · space talk</div>
<script>
// ---------------------------------------------------------------- glyphs
// Local coordinates around each part's centre (viewBox units). Edit freely: any closed path works.
const stadium = (w, h) => { const r = Math.min(w, h) / 2, a = w / 2 - r, b = h / 2 - r;
  return `M ${-a} ${-h/2} L ${a} ${-h/2} A ${r} ${r} 0 0 1 ${w/2} ${-b} L ${w/2} ${b} A ${r} ${r} 0 0 1 ${a} ${h/2}` +
         ` L ${-a} ${h/2} A ${r} ${r} 0 0 1 ${-w/2} ${b} L ${-w/2} ${-b} A ${r} ${r} 0 0 1 ${-a} ${-h/2} Z`; };
const GLYPHS = {
  // eyes
  pill:     stadium(44, 96),
  pillLow:  stadium(44, 58),                                         // squished, for asymmetric looks
  dot:      stadium(70, 70),
  dome:     'M -40 18 A 40 40 0 0 1 40 18 Z',                          // happy half-moon
  chevron:  'M -24 -32 L 22 0 L -24 32 L 22 0 Z',                      // ">"  (mirrored: "<")
  heart:    'M 0 34 C -70 -8 -38 -62 0 -26 C 38 -62 70 -8 0 34 Z',
  cross:    'M -26 -26 L 26 26 L 0 0 L 26 -26 L -26 26 L 0 0 Z',       // "×"
  closed:   'M -28 0 L 28 0 Z',                                        // blink
  sleepy:   'M -30 -6 Q 0 22 30 -6 Q 0 22 -30 -6 Z',                   // "◡"
  // mouths
  smile:    'M -30 -4 Q 0 24 30 -4 Q 0 24 -30 -4 Z',                   // "‿"
  grin:     'M -36 -6 L 36 -6 A 36 36 0 0 1 -36 -6 Z',                 // "D", open and happy
  frown:    'M -24 10 Q 0 -14 24 10 Q 0 -14 -24 10 Z',                 // "∩"
  o:        stadium(30, 34),
  tiny:     stadium(14, 14),
  triangle: 'M 0 -14 L 15 11 L -15 11 Z',
  flat:     'M -20 0 L 20 0 Z',
  wavy:     'M -36 0 Q -27 -10 -18 0 Q -9 10 0 0 Q 9 -10 18 0 Q 27 10 36 0' +
            ' Q 27 10 18 0 Q 9 -10 0 0 Q -9 10 -18 0 Q -27 -10 -36 0 Z',
};

// ---------------------------------------------------------------- expressions
//   eyes: [left, right]; "name|m" = mirrored. talk: the open mouth used for lip sync.
//   y / tilt / spread: small layout nudges.
const EMOTIONS = {
  neutral:   { eyes:['pill', 'pill'],         mouth:'smile',    talk:'grin' },
  happy:     { eyes:['dome', 'dome'],         mouth:'grin',     talk:'grin' },
  excited:   { eyes:['chevron', 'chevron|m'], mouth:'grin',     talk:'grin', bounce:1 },
  curious:   { eyes:['pill', 'pillLow'],      mouth:'o',        talk:'o', tilt:-6 },
  surprised: { eyes:['dot', 'dot'],           mouth:'triangle', talk:'o' },
  sad:       { eyes:['pill', 'pill'],         mouth:'frown',    talk:'o', y:16, spread:-12 },
  confused:  { eyes:['pill', 'pillLow'],      mouth:'wavy',     talk:'o', tilt:5 },
  love:      { eyes:['heart', 'heart'],       mouth:'smile',    talk:'grin' },
};
const OFFLINE = { eyes:['sleepy', 'sleepy'], mouth:'tiny', talk:'tiny', y:14 };

// ---------------------------------------------------------------- morphing
const N = 64;
const probe = document.createElementNS('http://www.w3.org/2000/svg', 'path');
probe.style.visibility = 'hidden';   // only used to measure glyphs
document.querySelector('svg').appendChild(probe);
const cache = {};

function points(spec) {          // glyph name (+ "|m") → N points, start leftmost, clockwise
  if (cache[spec]) return cache[spec];
  const [name, m] = spec.split('|');
  probe.setAttribute('d', GLYPHS[name]);
  const len = probe.getTotalLength();
  let pts = Array.from({ length: N }, (_, i) => {
    const p = probe.getPointAtLength(len * i / N);
    return [m ? -p.x : p.x, p.y];
  });
  let area = 0;
  for (let i = 0; i < N; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % N]; area += x1 * y2 - x2 * y1; }
  if (area < -1) pts.reverse();
  let s = 0;                     // same starting point everywhere, so shapes don't twist mid-morph
  pts.forEach((p, i) => { if (p[0] < pts[s][0] - .5 || (Math.abs(p[0] - pts[s][0]) <= .5 && p[1] < pts[s][1])) s = i; });
  return cache[spec] = pts.slice(s).concat(pts.slice(0, s));
}
const blend = (a, b, t) => a.map((p, i) => [p[0] + (b[i][0] - p[0]) * t, p[1] + (b[i][1] - p[1]) * t]);
const toPath = (pts, dx, dy, s = 1) =>
  'M' + pts.map(p => `${(p[0] * s + dx).toFixed(1)} ${(p[1] * s + dy).toFixed(1)}`).join('L') + 'Z';

// ---------------------------------------------------------------- state
let emotion = 'neutral', state = 'offline';
const cur = { eyeL: points('sleepy'), eyeR: points('sleepy'), mouth: points('tiny'),
              y: 0, tilt: 0, spread: 0, scale: 1, open: 0, gx: 0, gy: 0, thought: 0 };
const gaze = { x: 0, y: 0, next: 0 };
let blink = { start: -1, next: performance.now() + 2500 };
let mouthEnv = null;
const $ = s => document.querySelector(s);
const DEMO = new URLSearchParams(location.search).has('demo');

function setEmotion(e) { if (EMOTIONS[e]) emotion = e; }
function setState(s) {
  if (s === state || !['offline', 'idle', 'listening', 'thinking', 'speaking'].includes(s)) return;
  state = s;
  if (s !== 'speaking') mouthEnv = null;
  if (s === 'idle' && emotion !== 'neutral') setTimeout(() => state === 'idle' && setEmotion('neutral'), 6000);
}
function speak(env, dt) { mouthEnv = { env, dt, start: performance.now() }; }

function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') setState(m.state);
    else if (m.type === 'emotion') setEmotion(m.emotion);
    else if (m.type === 'mouth') speak(m.env, m.dt);
  };
  es.onerror = () => setState('offline');   // EventSource reconnects by itself
}

// ---------------------------------------------------------------- animation
const ease = (from, to, dt, k) => from + (to - from) * (1 - Math.exp(-k * dt));

function frame(now) {
  const dt = Math.min(0.05, Math.max(0, now - (frame.last || now)) / 1000); frame.last = Math.max(now, frame.last || 0);
  const ex = state === 'offline' ? OFFLINE : EMOTIONS[emotion];

  // blink: snap to a line for ~130 ms every 2-6 s
  if (blink.start < 0 && now > blink.next && state !== 'offline') blink.start = now;
  const blinking = blink.start >= 0 && now - blink.start < 130;
  if (blink.start >= 0 && !blinking) { blink.start = -1; blink.next = now + 2000 + Math.random() * 4000; }

  // eyes
  const eyeK = blinking ? 45 : 14;
  cur.eyeL = blend(cur.eyeL, points(blinking ? 'closed' : ex.eyes[0]), 1 - Math.exp(-eyeK * dt));
  cur.eyeR = blend(cur.eyeR, points(blinking ? 'closed' : ex.eyes[1]), 1 - Math.exp(-eyeK * dt));

  // mouth: the expression's mouth, opened toward its talk glyph by the speech envelope
  let open = 0;
  if (mouthEnv) {
    const i = Math.floor((now - mouthEnv.start) / 1000 / mouthEnv.dt);
    if (i < mouthEnv.env.length) open = mouthEnv.env[i]; else mouthEnv = null;
  }
  cur.open = ease(cur.open, open, dt, 30);
  const mouthTarget = state === 'thinking' ? points('flat') : blend(points(ex.mouth), points(ex.talk), cur.open);
  cur.mouth = blend(cur.mouth, mouthTarget, 1 - Math.exp(-(mouthEnv ? 40 : 14) * dt));

  // layout: gaze, tilt, listening lean-in, thinking glance
  if (now > gaze.next) {
    const r = Math.random;
    if (state === 'thinking') { gaze.x = 40; gaze.y = -30; gaze.next = now + 1e9; }
    else if (state === 'listening' || state === 'speaking') { gaze.x = (r() - .5) * 16; gaze.y = (r() - .5) * 8; gaze.next = now + 1200 + r() * 1500; }
    else { gaze.x = r() < .4 ? 0 : (r() - .5) * 90; gaze.y = (r() - .5) * 36; gaze.next = now + 1500 + r() * 3500; }
  }
  if (state !== 'thinking' && gaze.next > now + 1e8) gaze.next = 0;
  const off = state === 'offline';
  cur.gx = ease(cur.gx, off ? 0 : gaze.x, dt, 6);
  cur.gy = ease(cur.gy, off ? 0 : gaze.y, dt, 6);
  cur.y = ease(cur.y, ex.y || 0, dt, 8);
  cur.tilt = ease(cur.tilt, ex.tilt || 0, dt, 8);
  cur.spread = ease(cur.spread, ex.spread || 0, dt, 8);
  cur.scale = ease(cur.scale, state === 'listening' ? 1.1 : 1, dt, 8);
  cur.thought = ease(cur.thought, state === 'thinking' ? 1 : 0, dt, 10);

  draw(now, ex);
  requestAnimationFrame(frame);
}

function draw(now, ex) {
  const bob = Math.sin(now / (state === 'offline' ? 1400 : 900)) * (state === 'offline' ? 6 : 3)
            + (ex.bounce && state !== 'offline' ? Math.abs(Math.sin(now / 160)) * -8 : 0);
  const ey = -40 + cur.y + cur.gy + bob, gap = 150 + cur.spread;
  $('#face').setAttribute('transform', `rotate(${cur.tilt.toFixed(2)})`);
  $('#eyeL').setAttribute('d', toPath(cur.eyeL, -gap + cur.gx, ey, cur.scale));
  $('#eyeR').setAttribute('d', toPath(cur.eyeR, gap + cur.gx, ey, cur.scale));
  $('#mouth').setAttribute('d', toPath(cur.mouth, cur.gx * .5, 70 + cur.y * .6 + cur.gy * .4 + bob));

  const th = $('#thought');
  th.setAttribute('opacity', cur.thought.toFixed(2));
  th.setAttribute('transform', `translate(${250} ${-170 + bob})`);
  [...th.querySelectorAll('circle')].forEach((c, i) =>
    c.setAttribute('cy', (-Math.max(0, Math.sin(now / 180 - i * .9)) * 9).toFixed(1)));
}

// ---------------------------------------------------------------- demo / preview
const query = new URLSearchParams(location.search);
if (query.has('fps')) {
  let n = 0; const tick = () => { n++; requestAnimationFrame(tick); }; tick();
  setInterval(() => { $('#fps').textContent = n + ' fps'; n = 0; }, 1000);
}
if (DEMO) {
  document.body.classList.add('demo');
  setState('idle');
  const names = Object.keys(EMOTIONS);
  const talk = () => {
    setState('speaking');
    speak(Array.from({ length: 75 }, (_, i) => (i % 18 > 14 ? 0 : .35 + .65 * Math.abs(Math.sin(i / 2.3)))), 1 / 30);
    setTimeout(() => state === 'speaking' && setState('idle'), 2500);
  };
  addEventListener('keydown', e => {
    if (e.key >= '1' && e.key <= String(names.length)) setEmotion(names[e.key - 1]);
    else if (e.key === ' ') { e.preventDefault(); talk(); }
    else setState({ i:'idle', l:'listening', t:'thinking', s:'speaking', o:'offline' }[e.key] || state);
  });

  const cycle = parseFloat(query.get('cycle'));
  if (cycle > 0) {   // unattended showcase: every emotion, then each state
    $('#hint').style.display = 'none';
    const steps = [
      ...names.map(n => [n, () => { setState('idle'); setEmotion(n); }]),
      ['listening', () => { setEmotion('neutral'); setState('listening'); }],
      ['thinking', () => setState('thinking')],
      ['speaking', () => { setState('idle'); setEmotion('happy'); talk(); }],
      ['offline', () => setState('offline')],
    ];
    let i = 0;
    const next = () => { const [label, run] = steps[i++ % steps.length]; run(); $('#label').textContent = label; };
    next(); setInterval(next, cycle * 1000);
  }
} else {
  connect();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
